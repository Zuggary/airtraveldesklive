<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#173049"/>
      <stop offset="1" stop-color="#0b1520"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b33d" stop-opacity="0"/>
      <stop offset="1" stop-color="#f2b33d" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- radar rings, kept inside the circle crop -->
  <g fill="none" stroke="#9fd3ff" stroke-opacity="0.28" stroke-width="6">
    <circle cx="400" cy="400" r="300"/>
    <circle cx="400" cy="400" r="210"/>
    <circle cx="400" cy="400" r="120"/>
  </g>
  <g stroke="#9fd3ff" stroke-opacity="0.18" stroke-width="4">
    <line x1="100" y1="400" x2="700" y2="400"/>
    <line x1="400" y1="100" x2="400" y2="700"/>
  </g>
  <!-- sweep wedge -->
  <path d="M400 400 L700 400 A300 300 0 0 0 612 188 Z" fill="url(#sweep)"/>
  <!-- blips -->
  <circle cx="560" cy="300" r="16" fill="#f2b33d"/>
  <circle cx="270" cy="520" r="12" fill="#e5484d"/>
  <circle cx="300" cy="250" r="10" fill="#3ccf7c"/>
  <!-- plane, top view, heading up-right -->
  <g transform="translate(400 400) rotate(45) scale(5.2)" fill="#eef3f7">
    <path d="M0 -34 C3 -34 4 -30 4 -26 L4 -8 L30 6 L30 12 L4 4 L4 20 L12 26 L12 31 L0 28 L-12 31 L-12 26 L-4 20 L-4 4 L-30 12 L-30 6 L-4 -8 L-4 -26 C-4 -30 -3 -34 0 -34 Z"/>
  </g>
</svg>
