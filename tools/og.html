<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Air Travel Desk — OG Card</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0d1722;
      color: #eef3f7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .canvas {
      width: 1200px;
      height: 630px;
      padding: 56px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        radial-gradient(circle at 85% 18%, rgba(242, 179, 61, 0.14), transparent 42%),
        radial-gradient(circle at 12% 88%, rgba(34, 197, 94, 0.1), transparent 38%),
        #0d1722;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 16px;
    }
    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 0 6px rgba(239, 68, 68, 0.24);
    }
    .badge {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid #2a4360;
      background: #142233;
      color: #f2b33d;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .hero h1 {
      margin: 0 0 12px;
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .hero p {
      margin: 0;
      font-size: 30px;
      color: #b4c4d4;
      font-weight: 500;
    }
    .mini-board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .tile {
      background: #142233;
      border: 1px solid #253b54;
      border-left-width: 6px;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tile--clear {
      border-left-color: #22c55e;
    }
    .tile--delay {
      border-left-color: #f2b33d;
      background: linear-gradient(180deg, rgba(242, 179, 61, 0.1), #142233);
    }
    .tile--stop {
      border-left-color: #ef4444;
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.14), #142233);
    }
    .code {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .pill {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .tile--clear .pill {
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
    }
    .tile--delay .pill {
      background: rgba(242, 179, 61, 0.16);
      color: #f2b33d;
    }
    .tile--stop .pill {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      color: #b4c4d4;
      border-top: 1px solid #253b54;
      padding-top: 20px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <div class="brand">
        <span class="dot" aria-hidden="true"></span>
        <span class="badge">Live Status Board</span>
      </div>
      <span class="badge">FAA + NWS</span>
    </div>

    <div class="hero">
      <h1>Air Travel Desk</h1>
      <p>Live US flight delays and ground stops</p>
    </div>

    <div class="mini-board">
      <div class="tile tile--clear"><span class="code">Clear</span><span class="pill">No FAA delay</span></div>
      <div class="tile tile--delay"><span class="code">Delay</span><span class="pill">Ground delay</span></div>
      <div class="tile tile--stop"><span class="code">Stop</span><span class="pill">Ground stop</span></div>
    </div>

    <div class="footer">
      <span>www.airtraveldesklive.com</span>
      <span>30 Busiest US Airports</span>
    </div>
  </div>
</body>
</html>
