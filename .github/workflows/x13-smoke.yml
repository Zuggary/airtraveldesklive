name: x13 smoke (dispatch only, no deploy)
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: [self-hosted, x13, airtraveldesklive]
    timeout-minutes: 10
    steps:
      - name: Runner identity and tools
        shell: bash
        run: |
          echo "host=$COMPUTERNAME user=$USERNAME"
          bash --version | head -1
          python --version
          git --version
          date -u +%Y-%m
      - name: Outbound feeds (HEAD, status only)
        shell: bash
        run: |
          for u in https://nasstatus.faa.gov/api/airport-status-information https://www.tsa.gov/travel/passenger-volumes https://www.bts.gov/; do
            echo "$u -> $(curl -s -o /dev/null -m 20 -w '%{http_code}' -I "$u")"
          done
