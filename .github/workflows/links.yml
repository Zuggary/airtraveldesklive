name: Check airport links
# Report only. The daily link check runs here, away from the 5-minute data and deploy job, so it can never delay the site.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check airport guide and airport website links (HEAD requests, polite, report only)
        continue-on-error: true
        run: python tools/check_links.py --out data/link-report.json
      - name: Keep the report as a build artifact (not published to the site)
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: data/link-report.json
          if-no-files-found: ignore
          retention-days: 14
