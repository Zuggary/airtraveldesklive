name: Update Airport Status & Deploy Pages

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build airport status data
        run: python tools/build_status.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare _site directory
        run: |
          rm -rf _site
          mkdir -p _site
          for file in index.html privacy.html app.js style.css og.png favicon.svg favicon.png CNAME; do
            if [ -f "$file" ]; then
              cp "$file" _site/
            fi
          done
          cp -r data _site/data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
