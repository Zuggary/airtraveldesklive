name: Update Airport Status & Deploy Pages

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Restore radar, TSA, BTS, places and weather cache
        uses: actions/cache@v4
        with:
          path: |
            data/tsa-cache
            data/tsa.json
            data/radar.png
            data/radar.json
            data/bts.json
            data/places.json
            data/wx.json
            data/storms.json
            data/nhc.json
            data/national.json
            data/board-history.json
          key: desk-cache-${{ github.run_id }}
          restore-keys: desk-cache-

      - name: Month key for the BTS download cache
        id: bts-month
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore BTS zip files (about 32 MB each; saved once a month)
        uses: actions/cache@v4
        with:
          path: data/bts-cache
          key: bts-zips-${{ steps.bts-month.outputs.ym }}
          restore-keys: bts-zips-

      - name: Build airport status data
        run: python tools/build_status.py

      - name: Build desk screen data (FAA, NWS, adsb.lol, aviationweather.gov, NOAA SPC and NHC, radar, TSA, BTS)
        run: python tools/build_web.py --out data

      - name: Build places list (OpenStreetMap, refreshed at most weekly)
        continue-on-error: true
        run: python tools/build_places.py --out data

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare _site directory
        run: |
          rm -rf _site
          mkdir -p _site
          for file in index.html stuck.html tv.html us-states.geojson qr-owed.svg privacy.html app.js lib.js stuck.js sw.js cine.js style.css og.png favicon.svg favicon.png CNAME robots.txt sitemap.xml; do
            if [ -f "$file" ]; then
              cp "$file" _site/
            fi
          done
          mkdir -p _site/data
          cp data/status.json data/state.json _site/data/
          for f in radar.png radar.json tsa.json airports.json bts.json places.json security-waits.json dot-commitments.json wx.json storms.json nhc.json national.json board-history.json; do if [ -f "data/$f" ]; then cp "data/$f" _site/data/; fi; done
          mkdir -p _site/brand
          cp brand/*.jpg brand/*.png brand/*.svg _site/brand/

      - name: Check that every public root file is published
        # The copy list above is an allowlist. Fail loudly if a public file at the root was left off it.
        run: |
          missing=0
          for f in *.html *.js *.css *.txt *.xml *.svg *.png *.geojson CNAME; do
            [ -f "$f" ] || continue
            [ -f "_site/$f" ] || { echo "::error::$f is in the repo root but not in _site; add it to the copy list"; missing=1; }
          done
          exit $missing

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # deploy-pages sometimes asks for the artifact a moment before GitHub lists it
      # ("No artifacts named github-pages"). Wait briefly, and retry once if the first try fails.
      - name: Wait for the artifact to register
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Retry deploy once
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
