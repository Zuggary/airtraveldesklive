name: Update Airport Status & Deploy Pages

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Restore radar and TSA cache
        uses: actions/cache@v4
        with:
          path: |
            data/tsa-cache
            data/tsa.json
            data/radar.png
            data/radar.json
          key: desk-cache-${{ github.run_id }}
          restore-keys: desk-cache-

      - name: Build airport status data
        run: python tools/build_status.py

      - name: Build desk screen data (FAA, NWS, adsb.lol, radar, TSA)
        run: python tools/build_web.py --out data

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare _site directory
        run: |
          rm -rf _site
          mkdir -p _site
          for file in index.html tv.html us-states.geojson qr-owed.svg privacy.html app.js style.css og.png favicon.svg favicon.png CNAME; do
            if [ -f "$file" ]; then
              cp "$file" _site/
            fi
          done
          mkdir -p _site/data
          cp data/status.json data/state.json _site/data/
          for f in radar.png radar.json tsa.json; do [ -f "data/$f" ] && cp "data/$f" _site/data/; done
          mkdir -p _site/brand
          cp brand/*.jpg brand/*.png brand/*.svg _site/brand/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
